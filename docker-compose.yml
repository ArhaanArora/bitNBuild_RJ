version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillverify
      POSTGRES_PASSWORD: skillverify
      POSTGRES_DB: skillverifydb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillverify']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./packages/api
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      DATABASE_URL: postgres://skillverify:skillverify@postgres:5432/skillverifydb
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production_32ch}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_32chars}
      NODE_ENV: development
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./packages/api/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./packages/client
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: ''
    depends_on:
      - api

volumes:
  pgdata:
